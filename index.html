<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c130e">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'">
<title>Viktorovy kostky</title>
<link rel="stylesheet" href="styl.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='1' y='1' width='18' height='18' rx='4' fill='%23f0c419'/%3E%3Ccircle cx='10' cy='10' r='2.5' fill='%238a8d91'/%3E%3C/svg%3E">
</head>
<body>
<header class="hlava">
  <button class="zpet" id="zpet" type="button" aria-label="Zpět na výběr kostek" hidden>‹ Zpět</button>
  <h1><span class="maly">Viktorovy</span> kostky</h1>
</header>

<main>
  <!-- menu: one big button per die (filled in by kostky.js) -->
  <section id="menu" class="menu" aria-label="Výběr kostky">
    <p class="vyzva">Čím házíš?</p>
    <div class="tlacitka" id="tlacitka"></div>
  </section>

  <!-- roll view -->
  <section id="hod" class="hod" hidden>
    <h2 id="nazev"></h2>
    <div class="stul" id="stul"></div>
    <div class="vysledek" id="vysledek" aria-live="polite"></div>
    <p class="dalsi" id="dalsi"></p>
    <div class="modifikator" id="modifikator" hidden>
      <span class="mod-popis">Zbraně a kapsle</span>
      <button type="button" id="minus" aria-label="Ubrat bonus">−</button>
      <output id="mod">+0</output>
      <button type="button" id="plus" aria-label="Přidat bonus">+</button>
    </div>
    <div class="akce">
      <button type="button" class="hlavni" id="znovu">Hodit znovu</button>
      <button type="button" class="vedlejsi" id="navrat">Zpět</button>
    </div>
  </section>
</main>

<footer class="pata">Hází se poctivě: náhoda z <code>crypto.getRandomValues</code>. Žádné cookies, nic se neukládá ani neodesílá.</footer>

<script src="steny.js"></script>
<script src="kostky.js"></script>
</body>
</html>
